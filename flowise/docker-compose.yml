# Dedicated Flowise server for taskDataReadiness (separate from every other Flowise on this machine).
# Host network + HOST=127.0.0.1: reachable only from this machine, and it can call the local API on 127.0.0.1:8460.
# Secrets come from ../.env (generated by flowise/provision.py). Start everything with: ./start.sh flowise
name: tdr
services:
  flowise:
    image: flowiseai/flowise:3.1.2
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: "3460"
      APP_URL: http://127.0.0.1:3460
      SECRETKEY_STORAGE_TYPE: local
      FLOWISE_SECRETKEY_OVERWRITE: ${TDR_FLOWISE_SECRETKEY:?}
      JWT_AUTH_TOKEN_SECRET: ${TDR_FLOWISE_JWT_SECRET:?}
      JWT_REFRESH_TOKEN_SECRET: ${TDR_FLOWISE_JWT_REFRESH_SECRET:?}
      EXPRESS_SESSION_SECRET: ${TDR_FLOWISE_SESSION_SECRET:?}
      TOKEN_HASH_SECRET: ${TDR_FLOWISE_TOKEN_HASH_SECRET:?}
      DISABLE_FLOWISE_TELEMETRY: "true"
      # The Custom Function nodes must reach 127.0.0.1:8460; cloud metadata stays denied.
      HTTP_SECURITY_CHECK: "false"
      HTTP_DENY_LIST: 169.254.0.0/16,fd00:ec2::254
    volumes: ["tdr-flowise:/root/.flowise"]
    restart: unless-stopped
volumes:
  tdr-flowise:
