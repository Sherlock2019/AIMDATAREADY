# DEMO CATALOG: every record below is SYNTHETIC. Names echo the SCInsight demo (warehouses WH-A/B/C, product
# SUN-SPF50-100) so the integration story is concrete, but no value was read from SAP or from that project.
# Lineage fields describe these demo records only; they are not production lineage.
catalog_version: "demo-2026-11-14"
notice: Synthetic demo catalog. Not connected to SAP, a data catalog product or any production system.

assets:
  - asset_id: sap_inventory_snapshot
    kind: table
    description: Stock by batch per warehouse (synthetic SAP S/4HANA-style snapshot).
    classification: internal
    synthetic: true
    business_owner: Demo Inventory Control (fictional)
    technical_owner: Demo Data Platform team (fictional)
    source_name: S4HANA-SYNTHETIC / MARD+MCHB extract
    source_version: SAP-SYN-2026-11-14
    source_event_time: "2026-11-14T06:00:00+00:00"   # stock position "as of"
    ingested_at: "2026-11-14T06:30:00+00:00"         # copy loaded here
    contract_ref: contracts/inventory_snapshot@1.2 (demo reference, no contract engine)
    known_limitations:
      - Synthetic data; quantities are illustrative.
      - One snapshot per day; intraday movements are not visible.
    schema: [product_id, warehouse_id, batch_id, quantity, uom, status, expiry_date]
    coverage:
      product: [SKU-001, SKU-002, SUN-SPF50-100]
      warehouse: [WH-A, WH-B, WH-C]
    access:
      roles: [planner]
      agents: [demo-agent-scinsight-supervisor]
      purposes: [inventory_planning]
      row_scope: warehouse

  - asset_id: demand_forecast_weekly
    kind: table
    description: Weekly demand forecast per product and warehouse (synthetic).
    classification: internal
    synthetic: true
    business_owner: Demo Demand Planning (fictional)
    technical_owner: Demo Data Science team (fictional)
    source_name: demo-forecast-job
    source_version: FCST-2026-W46
    source_event_time: "2026-11-13T00:00:00+00:00"   # forecast run time
    ingested_at: "2026-11-13T01:00:00+00:00"
    contract_ref: null
    known_limitations:
      - Baseline forecast; promotions are not modelled.
    schema: [product_id, warehouse_id, week_start, forecast_units, model_version]
    coverage:
      product: [SKU-001, SKU-002, SUN-SPF50-100]
      warehouse: [WH-A, WH-B, WH-C]
      period: ["2026-11-10/2027-01-31"]
    access:
      roles: [planner]
      agents: [demo-agent-scinsight-supervisor]
      purposes: [inventory_planning]
      row_scope: warehouse

  - asset_id: transfer_lead_times
    kind: table
    description: Road transfer lead times between warehouses (synthetic).
    classification: internal
    synthetic: true
    business_owner: Demo Logistics (fictional)
    technical_owner: null                            # deliberately unknown; the profile does not require it
    source_name: demo-tm-lanes
    source_version: LANES-2026-11
    source_event_time: "2026-11-01T00:00:00+00:00"
    ingested_at: "2026-11-01T02:00:00+00:00"
    known_limitations:
      - Planned lead times, not measured transit times.
    schema: [origin_warehouse, destination_warehouse, mode, lead_time_days, cost_per_unit_eur]
    coverage:
      lane: ["WH-A>WH-B", "WH-A>WH-C", "WH-B>WH-A", "WH-B>WH-C", "WH-C>WH-A", "WH-C>WH-B"]
    access:
      roles: [planner]
      agents: [demo-agent-scinsight-supervisor]
      purposes: [inventory_planning]

  - asset_id: policy_documents
    kind: document_set
    description: Supply-chain policy documents prepared for RAG (synthetic).
    classification: internal
    synthetic: true
    business_owner: Demo Supply Chain Governance (fictional)
    technical_owner: Demo Knowledge Platform team (fictional)
    source_name: demo-dms
    source_version: DMS-EXPORT-2026-11-12
    source_event_time: "2026-11-12T00:00:00+00:00"
    ingested_at: "2026-11-12T03:00:00+00:00"
    known_limitations:
      - Only the documents listed here are indexed.
    access:
      roles: [planner, policy_reader, finance_controller]
      agents: [demo-agent-scinsight-supervisor]
      purposes: [policy_lookup]
    documents:
      - doc_id: POL-RET-001
        title: Supplier returns policy
        version: "2.1"
        source_id: dms://policies/POL-RET-001/v2.1
        status: approved
        valid_from: 2026-01-01
        valid_to: 2027-12-31
        access_roles: [planner, policy_reader]
        purposes: [policy_lookup]
        text: >
          Supplier returns: defective goods may be returned to the supplier within 30 days of receipt with a
          return authorisation number. Returns of non-defective goods require the category manager's approval.
      - doc_id: POL-RET-000
        title: Supplier returns policy (old)
        version: "1.0"
        source_id: dms://policies/POL-RET-001/v1.0
        status: revoked
        valid_from: 2024-01-01
        valid_to: 2025-12-31
        access_roles: [planner, policy_reader]
        purposes: [policy_lookup]
        text: >
          Supplier returns: goods may be returned within 90 days of receipt without authorisation.
      - doc_id: POL-WH-020
        title: Warehouse transfer policy
        version: "1.4"
        source_id: dms://policies/POL-WH-020/v1.4
        status: approved
        valid_from: 2026-03-01
        valid_to: null
        access_roles: [planner, policy_reader]
        purposes: [policy_lookup]
        text: >
          Warehouse transfers: transfer only released stock with at least 90 days of remaining shelf life. Reserved
          stock is never transferred. The donor warehouse keeps at least its target days of cover.
      - doc_id: POL-QA-050
        title: Batch quarantine procedure (draft)
        version: "0.3"
        source_id: dms://drafts/POL-QA-050/v0.3
        status: draft
        valid_from: 2026-12-01
        access_roles: [planner, policy_reader]
        purposes: [policy_lookup]
        text: >
          Draft: quarantined batches are reviewed weekly; returns of quarantined stock follow the supplier agreement.
      - doc_id: POL-FIN-900
        title: Supplier payment terms (restricted)
        version: "3.0"
        source_id: dms://restricted/POL-FIN-900/v3.0
        status: approved
        valid_from: 2026-01-01
        classification: restricted
        access_roles: [finance_controller]
        purposes: [policy_lookup]
        text: >
          Supplier returns are credited against the next payment run; early payment discounts are confidential.
