# SIMULATED SAP landscape for the Data Harness demo. No connection to any SAP system: each "system" is synthetic CSV
# data (pipeline/sap_source, generated by pipeline/build_pipeline.py). API names are labels, not calls.
context: {product_id: SKU-001, origin_warehouse: WH-A, destination_warehouse: WH-C, planning_period: 2026-11-16/2026-11-29}

# The metadata check verifies every one of these fields in the catalog record (catalog.yaml) ...
catalog_required_fields:
  # A identity and ownership
  - name
  - description
  - business_domain
  - business_owner
  - data_steward
  - technical_owner
  - contact
  - lifecycle_status
  - owner_reviewed_on
  # B source and history (version, event and ingestion times come from the extraction manifest)
  - source_system
  - source_location
  - source_record_id
  - source_version
  - source_event_time
  - ingested_at
  - transformation_history
  - lineage
  - change_history
  # C business meaning and coverage (warehouse / product / time coverage are computed from the rows)
  - business_definitions
  - schema_types
  - units
  - granularity
  - geographic_coverage
  - known_limitations
  - approved_use_cases
  # D quality, security and AI readiness (freshness, completeness, validity, duplicates: computed by checks)
  - classification
  - permitted_users
  - permitted_agents
  - permitted_purposes
  - retention
document_catalog_fields: [document_authority, rag_index_version]   # extra fields for document collections
# ... and every one of these sections in the data contract (contracts.yaml).
contract_required_sections: [id, version, status, description, producer, consumer, purpose, ownership, source_rules,
                             schema, business_definitions, quality, freshness, coverage, security, lineage,
                             operational_expectations, change_management, evidence, human_approval]

systems:
  - {id: s4_mm, name: S/4HANA MM, label: Inventory snapshot, asset: s4_mm_stock, requirement: inventory, domain: inventory}
  - {id: ewm, name: SAP EWM, label: Bin stock, asset: ewm_bin_stock, requirement: bin_stock, domain: warehouse}
  - {id: tm, name: SAP TM, label: Transfer lead times and costs, asset: tm_lanes, requirement: transfer_lead_times,
     domain: logistics}
  - {id: ibp, name: SAP IBP, label: Demand forecast, asset: ibp_demand_forecast, requirement: demand_forecast,
     domain: inventory}
  - {id: s4_pp, name: S/4HANA PP, label: Production orders, asset: s4_pp_orders, requirement: production_orders,
     domain: factory}
  - {id: s4_sd, name: S/4HANA SD, label: Sales orders, asset: s4_sd_orders, requirement: sales_orders, domain: logistics}
  - {id: ariba, name: SAP Ariba, label: Open purchase orders, asset: ariba_pos, requirement: open_purchase_orders,
     domain: procurement}
  - {id: qm, name: SAP QM, label: Inspection lots, asset: qm_inspection_lots, requirement: inspection_lots,
     domain: quality}
  - {id: mdg, name: SAP MDG, label: Material master, asset: mdg_material_master, requirement: material_master,
     domain: master_data}
  - {id: ariba_docs, name: SAP Ariba Contracts + DMS, label: Approved policies and agreements, asset: ariba_contracts,
     requirement: supplier_agreements, domain: procurement}

# Faults the simulated extraction can inject. The engine never reads this list; `check` is only used to know which
# recorded upstream fix (from an approved correction) prevents the fault in the next round.
faults:
  - {id: mm_stale, check: freshness, system: s4_mm, title: "Stale inventory snapshot (3 days old, re-loaded today)",
     op: meta, set: {source_version: S4-MM-2026-11-11, source_event_time: "2026-11-11T06:00:00+00:00",
                     ingested_at: "2026-11-14T07:30:00+00:00"}}
  - {id: mm_bad_status, check: quality, system: s4_mm, title: "Status codes 'Released' and 'ok'",
     op: set_values, where: {batch_id: [A-001-1, C-001-1]}, column: status, values: [Released, ok]}
  - {id: mm_unit_mismatch, check: quality, system: s4_mm, title: "Incompatible unit (KG instead of EA)",
     op: set_values, where: {batch_id: [C-001-2]}, column: uom, values: [KG]}
  - {id: ewm_missing_wh_c, check: coverage, system: ewm, title: Warehouse C bin stock missing, op: drop_rows,
     where: {warehouse_id: [WH-C]}}
  - {id: tm_missing_lane, check: coverage, system: tm, title: "Transfer lead time WH-A > WH-C missing", op: drop_rows,
     where: {origin_warehouse: [WH-A], destination_warehouse: [WH-C]}}
  - {id: ibp_short_horizon, check: coverage, system: ibp, title: Forecast horizon cut to one week, op: drop_rows,
     where: {week_start: ["2026-11-16", "2026-11-23", "2026-11-30", "2026-12-07"]}}
  - {id: pp_negative_qty, check: quality, system: s4_pp, title: Negative production order quantity, op: set_values,
     where: {order_id: [PP-1002]}, column: quantity, values: ["-500"]}
  - {id: sd_bad_dates, check: quality, system: s4_sd, title: "Requested dates as DD/MM/YYYY", op: date_format,
     column: requested_date, format: "%d/%m/%Y"}
  - {id: ariba_missing_dates, check: quality, system: ariba, title: Some PO delivery dates missing, op: set_values,
     where: {po_id: [PO-4500003]}, column: due_date, values: [""]}
  - {id: ariba_duplicates, check: quality, system: ariba, title: Duplicate purchase orders, op: duplicate_rows,
     where: {po_id: [PO-4500002, PO-4500004]}}
  - {id: qm_null_decision, check: quality, system: qm, title: Empty usage decisions, op: set_values,
     where: {lot_id: [IL-0001, IL-0007]}, column: usage_decision, values: ["", ""]}
  - {id: mdg_missing_owner, check: provenance, system: mdg, title: Material master owners not recorded, op: meta,
     set: {business_owner: null, technical_owner: null}}
  - {id: mdg_catalog_incomplete, check: metadata, system: mdg, title: "Catalog record incomplete (steward, contact)",
     op: meta, set: {data_steward: null, contact: null}}
  - {id: contract_expired, check: documents, system: ariba_docs, title: Policies and agreements expired, op: set_values,
     where: {doc_id: [AGR-SUP-A, AGR-SUP-C, POL-PURCH-001, POL-WH-020]}, column: valid_to,
     values: ["2026-10-31", "2026-10-31", "2026-10-31", "2026-10-31"]}
  - {id: authz_down, check: access, system: s4_mm, title: Authorization service unavailable, op: authz_unavailable,
     in_all: false}   # not part of "all": it would hide every other fault
