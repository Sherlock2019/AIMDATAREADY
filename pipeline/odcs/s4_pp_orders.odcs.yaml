# ODCS v3.1.0 data contract + catalog record for `s4_pp_orders` - SINGLE SOURCE OF TRUTH (edit this file).
# Validated against the official ODCS JSON Schema at load time. SIMULATED SAP landscape, fictional owners.
apiVersion: v3.1.0
kind: DataContract
id: production_orders
version: '1.0'
status: approved
name: Production orders
domain: factory
description:
  purpose: Planned and released production orders.
schema:
- name: s4_pp_orders
  physicalName: s4_pp_orders.csv
  physicalType: file
  logicalType: object
  properties:
  - name: order_id
    logicalType: string
    physicalType: string
    primaryKey: true
    primaryKeyPosition: 1
  - name: product_id
    logicalType: string
    physicalType: string
  - name: plant
    logicalType: string
    physicalType: string
  - name: quantity
    logicalType: integer
    physicalType: integer
    required: true
    quality:
    - name: non_negative
      type: sql
      dimension: conformity
      mustBe: 0
      query: SELECT COUNT(*) FROM s4_pp_orders WHERE quantity < 0
  - name: due_date
    logicalType: date
    physicalType: date
    required: true
    quality:
    - name: iso_dates
      type: library
      metric: invalidValues
      dimension: conformity
      arguments:
        pattern: ^\d{4}-\d{2}-\d{2}$
      mustBe: 0
  - name: status
    logicalType: string
    physicalType: string
    description: planned | released | confirmed
    quality:
    - name: allowed_values
      type: library
      metric: invalidValues
      dimension: conformity
      arguments:
        validValues:
        - planned
        - released
        - confirmed
      mustBe: 0
  description: Planned and released production orders of the factory.
  dataGranularityDescription: one production order
  customProperties:
  - property: requiredFields
    value:
    - order_id
    - product_id
    - quantity
    - due_date
    - status
  - property: uniqueKeyDeclared
    value: true
slaProperties:
- property: latency
  value: 48
  unit: h
  element: source_event_time
  description: Maximum age of the source data (source event time) for any consumer.
- property: retention
  value: Keep 13 months; staging copies are deleted at the next extraction; derived outputs follow the source.
team:
  members:
  - username: Production Planning team (fictional)
    role: owner
  - username: SAP Integration team (fictional)
    role: technical owner
  - username: Supply Chain Data team (fictional)
    role: data steward
support:
- channel: '#sc-data-support (fictional channel)'
  tool: slack
  scope: issues
roles:
- role: production planners
  access: read
  customProperties:
  - property: principalType
    value: user group
- role: supply-chain director
  access: read
  customProperties:
  - property: principalType
    value: user group
- role: agent:planning-agent
  access: read
  customProperties:
  - property: principalType
    value: agent
- role: agent:procurement-agent
  access: read
  customProperties:
  - property: principalType
    value: agent
- role: agent:supervisor-agent
  access: read
  customProperties:
  - property: principalType
    value: agent
customProperties:
- property: catalogLifecycleStatus
  value: active
- property: catalogOwnerReviewedOn
  value: '2026-10-01'
- property: catalogGeographicCoverage
  value: France, Spain, Italy (warehouses WH-A Paris, WH-B Madrid, WH-C Milan)
- property: catalogSourceSystem
  value: SAP S/4HANA PP
- property: catalogSourceLocation
  value: API_PRODUCTION_ORDER_2_SRV
- property: catalogSourceRecordId
  value: order_id
- property: catalogTransformationHistory
  value:
  - none
- property: catalogLineage
  value:
  - SAP S/4HANA PP
  - connector v1.4
  - staging
  - readiness gate
  - factory agent
- property: catalogChangeHistory
  value:
  - 2026-07-15 status confirmed added
- property: catalogUnits
  value: EA
- property: catalogKnownLimitations
  value:
  - costs are not extracted
- property: catalogApprovedUseCases
  value:
  - production planning
  - executive reporting
- property: catalogClassification
  value: internal
- property: catalogPermittedPurposes
  value:
  - supply_chain_planning
- property: contractConsumer
  value: SCInsight planning agents (via the readiness gate)
- property: contractPurpose
  value:
  - supply_chain_planning
- property: contractSecurity
  value:
    external_model_processing: requires_approval
- property: contractOperationalExpectations
